<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sodor Steam Racers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;user-select:none}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;pointer-events:none;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.6);font-weight:bold}
  #pos{left:24px;bottom:16px;font-size:84px;line-height:1;color:#ffd53d}
  #pos small{font-size:36px}
  #lap{left:24px;top:16px;font-size:28px}
  #time{left:24px;top:52px;font-size:22px;font-weight:normal}
  #info{left:24px;top:84px;font-size:14px;font-weight:normal;line-height:1.5}
  #item{left:50%;top:14px;transform:translateX(-50%);width:92px;height:92px;border:5px solid #ffd53d;border-radius:18px;background:rgba(0,0,40,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:46px}
  #item span{font-size:11px;margin-top:-4px}
  #msg{left:0;right:0;top:30%;text-align:center;font-size:110px;color:#ffd53d}
  #drift{left:50%;bottom:26px;transform:translateX(-50%);width:220px;height:14px;border:3px solid #fff;border-radius:9px;overflow:hidden;background:rgba(0,0,0,.4);opacity:0}
  #drift div{height:100%;width:0;background:#4cf}
  #map{right:14px;top:14px;width:170px;height:170px;background:rgba(0,0,30,.35);border-radius:14px}
  #help{right:16px;bottom:12px;font-size:13px;font-weight:normal;text-align:right;opacity:.85}
  #menu,#results{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:linear-gradient(rgba(10,30,80,.6),rgba(10,30,80,.1) 34%,rgba(10,30,80,.1) 44%,rgba(10,30,80,.8));overflow:auto}
  #results{justify-content:center;background:rgba(10,20,60,.82);display:none}
  h1{font-size:50px;margin:14px 0 0;color:#ffd53d;text-shadow:0 4px 0 #b3261e,0 6px 10px #000;letter-spacing:2px;text-align:center}
  h2{margin:4px 12px 6px;font-size:15px;font-weight:normal;text-align:center;min-height:20px;text-shadow:0 1px 3px #000}
  h3{margin:6px 0 0;font-size:18px;color:#ffd53d;text-align:center}
  .spacer{flex:1;min-height:130px}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:5px 12px}
  .card{width:108px;padding:6px;border-radius:12px;background:rgba(0,0,30,.72);border:3px solid transparent;cursor:pointer;text-align:center}
  .card:hover,.trk:hover{border-color:#fff8}
  .card.sel{border-color:#ffd53d;background:rgba(20,40,120,.88)}
  .card b{display:block;font-size:15px}
  .sw{display:inline-block;width:32px;height:32px;border-radius:50%;border:3px solid #fff;line-height:32px;font-weight:bold;color:#ffd53d;margin-bottom:2px;text-shadow:0 1px 2px #000}
  .st{font-size:9px;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:2px 4px;align-items:center;margin-top:3px}
  .bar{height:5px;background:#fff3;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:#6f6}
  .trk{padding:8px 16px;border-radius:12px;background:rgba(0,0,30,.72);border:3px solid transparent;cursor:pointer;font-size:15px}
  .trk.sel{border-color:#ffd53d;background:rgba(20,40,120,.88)}
  .mode{font-size:19px;font-weight:bold;padding:10px 22px}
  button{font:inherit;font-weight:bold;font-size:22px;padding:11px 40px;margin:10px 8px 18px;border-radius:14px;border:0;background:#ffd53d;color:#123;cursor:pointer;box-shadow:0 5px 0 #b38a00}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #b38a00}
  .tables{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  table{border-collapse:collapse;font-size:19px;margin:8px}
  td{padding:4px 14px}
  tr.me{background:#ffd53d;color:#123;font-weight:bold}
  #game{display:none}
  #hof{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,20,60,.93);overflow:auto;z-index:5}
  #hof .row{margin:14px 12px}
  .dim{opacity:.7;font-size:14px}
  .kind{font-size:9px;opacity:.8;margin:1px 0}
  button.go{background:#6fe06a;box-shadow:0 5px 0 #2f8f3a;font-size:17px;padding:13px 22px}
  button.alt{background:#fff;box-shadow:0 5px 0 #99a}
  .who{font-size:14px;background:rgba(0,0,30,.72);padding:6px 12px;border-radius:10px}
  .who input{font:inherit;width:120px;margin-left:6px;padding:3px 6px;border-radius:6px;border:0}
  #musicBtn{right:14px;top:192px;padding:5px 12px;border-radius:10px;background:rgba(0,0,30,.55);border:2px solid #fff6;font-size:13px;pointer-events:auto;cursor:pointer}
  #musicBtn:hover{border-color:#ffd53d}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="game">
  <div class="hud" id="lap"></div>
  <div class="hud" id="time"></div>
  <div class="hud" id="info"></div>
  <div class="hud" id="item"></div>
  <div class="hud" id="pos"></div>
  <div class="hud" id="msg"></div>
  <div class="hud" id="drift"><div></div></div>
  <canvas class="hud" id="map" width="170" height="170"></canvas>
  <div class="hud" id="musicBtn"></div>
  <div class="hud" id="help">Arrows / WASD: drive &nbsp;•&nbsp; Shift: drift &nbsp;•&nbsp; Space: use item &nbsp;•&nbsp; M: music &nbsp;•&nbsp; P: pause &nbsp;•&nbsp; Esc: menu</div>
</div>

<div id="menu">
  <h1>SODOR STEAM RACERS</h1>
  <div class="row" id="modes"></div>
  <h2 id="modeDesc"></h2>
  <div class="spacer"></div>
  <div class="row" id="chars"></div>
  <div class="row" id="tracks"></div>
  <div class="row" id="diffs"></div>
  <div class="row"><div class="row" id="gfx" style="margin:0"></div><div class="row" id="music" style="margin:0"></div></div>
  <div class="row"><label class="who">Driver name <input id="who" maxlength="12" placeholder="Player"></label></div>
  <div><button id="start">START</button><button id="resume" class="go" style="display:none"></button><button id="hofBtn" class="alt">🏆 HALL OF FAME</button></div>
</div>

<div id="results">
  <h1 id="resTitle">FINISH!</h1>
  <div id="resBody"></div>
  <div><button id="again">RACE AGAIN</button><button id="back">MENU</button></div>
</div>

<div id="hof">
  <h1>HALL OF FAME</h1>
  <div class="row" id="hofTracks"></div>
  <div id="hofBody"></div>
  <button id="hofClose">CLOSE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.anisotropy=8; t.encoding=THREE.sRGBEncoding; return t; }

      g.strokeStyle='#2b2e3a'; g.lineWidth=3; g.lineJoin='round'; g.stroke();
      g.fillStyle='#fff'; g.beginPath(); g.moveTo(41,87); g.quadraticCurveTo(64,92.5,87,87); g.lineTo(83,93.5); g.quadraticCurveTo(64,98,45,93.5); g.closePath(); g.fill();

let state='menu', selChar=0, selTrack=0, mode='single', diff=1, season=null, paused=false, curTrack=0;

const smoke=[]; let smokeI=0;

const rivals = () => shuffle(CHARS.map((_,i)=>i).filter(i=>i!==selChar)).slice(0,7);
const aiSkill = g => 0.93+0.012*(7-g)+rand(0,0.02);

function makeKart(ci, grid, isAI, skill){

  const row=Math.floor(grid/2), idx=T.N-4-row*5, lat=grid%2?-2.8:2.8;
  const k={c, ci, mesh:m, body:m.userData.body, ai:isAI, isPlayer:!isAI, x:0, z:0, h:Math.atan2(T.tx[idx],T.tz[idx]), speed:0,

function newSeason(){

/* season save: one slot kept in the browser, written at the start of a season and after every race */
const SAVE_KEY='ssr_season_v1';
function saveSeason(nextRound){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({round:nextRound, roster:season.roster, pts:season.pts, skill:season.skill, selChar, diff, date:new Date().toISOString().slice(0,10)})); }catch(e){} }
function clearSeason(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadSeason(){
  try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!s||!Array.isArray(s.roster)||s.roster.length!==8||!s.pts||!s.skill) return null;
    if(!s.roster.every(ci=>Number.isInteger(ci)&&CHARS[ci]&&typeof s.pts[ci]==='number')||!s.roster.includes(s.selChar)) return null;

}

    order.forEach((ci,g)=>{ const me=ci===selChar, k=makeKart(ci,g,!me, me?1:(mode==='season'?season.skill[ci]:aiSkill(g))); karts.push(k); if(me) player=k; });

/* hall of fame: top times per track, kept in the browser */
const HOF_KEY='ssr_hof_v1', HOF_N=5;

/* ---------- items ---------- */
function rollItem(k){
  const r=k.rank, w={boost:1+r*0.4, oil:3-r*0.25, truck:2, whistle:0.4+r*0.2};
  let tot=0; for(const n in w) tot+=w[n]; let x=Math.random()*tot;
  for(const n in w){ x-=w[n]; if(x<=0) return n; } return 'boost';
}
function hit(k){ if(k.inv>0) return; k.spin=1.3; k.inv=2.6; k.boost=0; k.drift=0; if(k.isPlayer){ noise(0.4,300,0.4); beep(300,0.4,'sawtooth',0.1,80); } }
function useItem(k){
  const it=k.item; if(!it) return; k.item=null;
  const fx=Math.sin(k.h), fz=Math.cos(k.h);
  if(it==='boost'){ k.boost=1.6; if(k.isPlayer) noise(0.7,900,0.35); }
  else if(it==='oil'){
    const m=mesh(new THREE.CircleGeometry(1.6,16), new THREE.MeshBasicMaterial({color:C(0x0a0a12),transparent:true,opacity:0.85}), k.x-fx*3.2,0.1,k.z-fz*3.2, dyn); m.rotation.x=-Math.PI/2;
    slicks.push({x:m.position.x,z:m.position.z,mesh:m}); if(k.isPlayer) beep(200,0.2,'sine',0.15,90);
  } else if(it==='truck'){
    const g=new THREE.Group(); mesh(new THREE.BoxGeometry(1.3,1.0,1.8), M.grey, 0,1.0,0, g); mesh(new THREE.BoxGeometry(1.4,0.2,2.0), M.black, 0,0.45,0, g);
    mesh(new THREE.CircleGeometry(0.42,16), new THREE.MeshBasicMaterial({map:FACE_G,transparent:true}), 0,1.0,0.91, g);
    for(const sx of [-0.145,0.145]) mesh(new THREE.CircleGeometry(0.06,12), E.pupil, sx,1.085,0.915, g);
    for(const x of [-0.65,0.65]) for(const z of [-0.6,0.6]){ const w=mesh(new THREE.CylinderGeometry(0.3,0.3,0.14,10), M.black, x,0.3,z, g); w.rotation.z=Math.PI/2; }
    dyn.add(g); trucks.push({mesh:g, f:k.idx+2, lat:clamp(k.lat,-HW+1,HW-1), owner:k, life:6, x:k.x, z:k.z});
    if(k.isPlayer) beep(500,0.25,'square',0.1,900);
  } else if(it==='whistle'){
    const m=mesh(new THREE.RingGeometry(0.8,1,32), new THREE.MeshBasicMaterial({color:C(0xffffff),transparent:true,side:THREE.DoubleSide}), k.x,0.5,k.z, dyn); m.rotation.x=-Math.PI/2;
    rings.push({mesh:m,t:0}); for(const o of karts) if(o!==k && (o.x-k.x)**2+(o.z-k.z)**2 < 15*15) hit(o);
    if(k.isPlayer || (player.x-k.x)**2+(player.z-k.z)**2 < 40*40) whistle();
  }
}

/* ---------- kart update ---------- */
function updateKart(k, dt){
  const N=T.N, c=k.c;
  let steer=0, gas=0, brake=0, wantDrift=false;
  if(countdown<=0){
    if(k.ai){
      k.offT-=dt; if(k.offT<=0){ k.offT=rand(2,5); k.off=rand(-4,4); }
      const tp=trackPoint(k.idx+6,k.off,{}); const d=angDiff(Math.atan2(tp.x-k.x,tp.z-k.z),k.h);
      steer=clamp(d*3,-1,1); gas=1;
      if(k.item){ k.itemT-=dt; if(k.itemT<=0) useItem(k); }
    } else {
      steer=(keys.ArrowLeft||keys.KeyA?1:0)-(keys.ArrowRight||keys.KeyD?1:0);
      gas=keys.ArrowUp||keys.KeyW?1:0; brake=keys.ArrowDown||keys.KeyS?1:0;
      wantDrift=!!(keys.ShiftLeft||keys.ShiftRight);
    }
  }
  const offroad=Math.abs(k.lat)>HW+0.5;
  let maxS=c.speed;
  if(k.ai){
    const a=k.idx, b=(k.idx+10)%N; const bend=Math.abs(angDiff(Math.atan2(T.tx[b],T.tz[b]),Math.atan2(T.tx[a],T.tz[a])));
    const lead=(k.lap*N+k.idx)-(player.lap*N+player.idx);
    maxS*=k.skill*(1-Math.min(0.3,bend*0.3))*clamp(1-lead/N*0.6,0.9,1.1)*(k.isPlayer?1:DIFFS[diff].f);
  }
  if(k.boost>0){ maxS*=1.45; k.boost-=dt; } else if(offroad) maxS*=0.5;
  if(k.inv>0) k.inv-=dt;
  if(k.spin>0){ k.spin-=dt; k.speed*=Math.max(0,1-2.5*dt); }
  else {
    if(k.boost>0) k.speed=Math.min(maxS,k.speed+c.acc*3*dt);
    else if(gas&&k.speed<maxS) k.speed=Math.min(maxS,k.speed+c.acc*dt);
    else if(brake) k.speed=Math.max(-9,k.speed-32*dt);
    else if(!gas) k.speed-=Math.sign(k.speed)*Math.min(Math.abs(k.speed),7*dt);
    if(k.speed>maxS) k.speed=Math.max(maxS,k.speed-24*dt);
    // drift
    const drifting=wantDrift&&steer!==0&&k.speed>c.speed*0.5;
    if(drifting){ k.drift+=dt; k.driftDir=steer; }
    else { if(k.drift>0.8){ k.boost=Math.max(k.boost,0.45+Math.min(k.drift,2.2)*0.4); noise(0.4,1200,0.25); } k.drift=0; }
    const turn=c.turn*(k.ai?1.35:1)*(drifting?1.4:1);
    k.h+=steer*turn*dt*clamp(Math.abs(k.speed)/8,0,1)*(k.speed<0?-1:1);
  }
  k.x+=Math.sin(k.h)*k.speed*dt; k.z+=Math.cos(k.h)*k.speed*dt;
  locate(k);
  // lap finish
  if(!k.finished&&k.lap>LAPS){ k.finished=true; k.finishTime=raceTime; finishOrder.push(k); if(k.isPlayer){ k.ai=true; k.skill=0.8; finishDelay=3; $('msg').textContent='FINISH!'; whistle(); } }
  // item boxes
  if(!k.item&&k.pending<=0) for(const b of boxes) if(b.t<=0&&(b.x-k.x)**2+(b.z-k.z)**2<5){ b.t=3; b.mesh.visible=false; k.pending=k.isPlayer?1.1:0.5; k.pendItem=rollItem(k); if(k.isPlayer) beep(660,0.1,'square',0.08,990); break; }
  if(k.pending>0){ k.pending-=dt; if(k.pending<=0){ k.item=k.pendItem; k.itemT=rand(1,5); if(k.isPlayer) beep(990,0.15,'square',0.08); } }
  for(let i=slicks.length-1;i>=0;i--){ const s=slicks[i]; if((s.x-k.x)**2+(s.z-k.z)**2<4.5&&k.inv<=0){ hit(k); dyn.remove(s.mesh); slicks.splice(i,1); } }
  // visuals
  k.mesh.position.set(k.x,0,k.z); k.mesh.rotation.y=k.h;
  k.body.rotation.y = k.spin>0 ? (1.3-k.spin)/1.3*Math.PI*4 : (k.drift>0? k.driftDir*0.35 : k.body.rotation.y*0.8);
  k.mesh.visible = !(k.inv>0&&k.spin<=0&&Math.floor(k.inv*12)%2);
  k.wp+=k.speed*dt/0.42; k.sv+=(steer-k.sv)*Math.min(1,dt*8); animEngine(k.mesh,k.wp,k.sv);
  k.body.rotation.z=-k.sv*0.07*clamp(Math.abs(k.speed)/12,0,1); k.body.position.y=Math.abs(Math.sin(k.wp*0.25))*0.05; k.body.scale.z+=((k.boost>0?1.1:1)-k.body.scale.z)*Math.min(1,dt*8);
  if((offroad||k.drift>0)&&Math.abs(k.speed)>6){ k.dustT-=dt; if(k.dustT<=0){ k.dustT=0.06; puff(k.x-Math.sin(k.h)*1.3+rand(-.6,.6),0.4,k.z-Math.cos(k.h)*1.3+rand(-.6,.6),offroad?T.def.dust:(k.drift>0.8?0xffa630:0xdddddd),0.9,offroad?1.5:0.9); } }
  if(k.boost>0){ k.dustT-=dt; if(k.dustT<=0){ k.dustT=0.03; puff(k.x-Math.sin(k.h)*k.mesh.userData.len*0.5,0.9,k.z-Math.cos(k.h)*k.mesh.userData.len*0.5,Math.random()<.5?0xff5a1f:0xffd53d,0.6,0.8); } }
  k.smokeT-=dt*(0.5+Math.abs(k.speed)/12);
  if(k.smokeT<=0){ k.smokeT=0.16; const s=smoke[smokeI++%smoke.length], fs=k.mesh.userData.fz; s.m.position.set(k.x+Math.sin(k.h)*fs,k.mesh.userData.fy,k.z+Math.cos(k.h)*fs); s.life=1; s.rise=2.2; s.size=1.3; s.m.visible=true; s.m.material.color.setS(k.boost>0?0xffa630:(k.drift>0.8?0x55ccff:(k.c.smoke||0xffffff))); }
}
function locate(k){
  const N=T.N; let best=k.idx, bd=1e9;
  for(let o=-6;o<=12;o++){ const j=(k.idx+o+N)%N, d=(T.px[j]-k.x)**2+(T.pz[j]-k.z)**2; if(d<bd){bd=d;best=j;} }
  if(best<k.idx-N/2){ k.lap++; if(k.isPlayer) lapCross(); } else if(best>k.idx+N/2) k.lap--;
  k.idx=best;
  k.lat=(k.x-T.px[best])*T.nx[best]+(k.z-T.pz[best])*T.nz[best];
  const lim=FENCE-1.4; if(Math.abs(k.lat)>lim){ const ex=k.lat-Math.sign(k.lat)*lim; k.x-=T.nx[best]*ex; k.z-=T.nz[best]*ex; k.lat-=ex; k.speed*=0.99; }
}

/* ---------- main update ---------- */
function update(dt){
  if(countdown>0){
    countdown-=dt; const n=Math.ceil(countdown-1+0.0001);
    if(n!==lastCount){ lastCount=n; if(n>0){ $('msg').textContent=n; beep(440,0.2); } else { $('msg').textContent='GO!'; beep(880,0.6); whistle(); } }
    if(countdown<=1&&countdown>0){ countdown=0; syncMusicGain(); setTimeout(()=>{ if($('msg').textContent==='GO!') $('msg').textContent=''; },900); }
  } else raceTime+=dt;
  // ranks
  const order=karts.slice().sort((a,b)=> (a.finished&&b.finished)? a.finishTime-b.finishTime : a.finished?-1 : b.finished?1 : (b.lap*T.N+b.idx)-(a.lap*T.N+a.idx));
  order.forEach((k,i)=>k.rank=i+1);
  for(const k of karts) updateKart(k,dt);
  // collisions
  for(let i=0;i<karts.length;i++) for(let j=i+1;j<karts.length;j++){ const a=karts[i], b=karts[j]; let dx=b.x-a.x, dz=b.z-a.z; const d=Math.hypot(dx,dz);
    const md=a.rad+b.rad; if(d<md&&d>0.001){ const p=(md-d)/2; dx/=d; dz/=d; a.x-=dx*p; a.z-=dz*p; b.x+=dx*p; b.z+=dz*p; a.speed*=0.985; b.speed*=0.985; } }
  // boxes
  for(const b of boxes){ b.mesh.rotation.y+=dt*2; b.mesh.rotation.x+=dt; b.mesh.position.y=1.5+Math.sin(raceTime*3+b.x)*0.25; if(b.t>0){ b.t-=dt; if(b.t<=0) b.mesh.visible=true; } }
  // trucks
  for(let i=trucks.length-1;i>=0;i--){ const t=trucks[i]; t.life-=dt; t.f+=44*dt/T.spacing; const i0=Math.floor(t.f), fr=t.f-i0, a=trackPoint(i0,t.lat,{}), b=trackPoint(i0+1,t.lat,{});
    t.x=a.x+(b.x-a.x)*fr; t.z=a.z+(b.z-a.z)*fr; t.mesh.position.set(t.x,0,t.z); t.mesh.rotation.y=Math.atan2(b.x-a.x,b.z-a.z);
    let dead=t.life<=0; for(const k of karts) if(k!==t.owner&&(k.x-t.x)**2+(k.z-t.z)**2<5.5&&k.inv<=0){ hit(k); dead=true; break; }
    if(dead){ dyn.remove(t.mesh); trucks.splice(i,1); } }
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.t+=dt; r.mesh.scale.setScalar(1+r.t*30); r.mesh.material.opacity=1-r.t*2; if(r.t>0.5){ dyn.remove(r.mesh); rings.splice(i,1); } }
  for(const s of smoke) if(s.life>0){ s.life-=dt*1.4; s.m.position.y+=dt*s.rise; s.m.scale.setScalar(s.size*(1+(1-s.life)*2.2)); s.m.material.opacity=Math.max(0,s.life*0.7); if(s.life<=0) s.m.visible=false; }
  // chuff sound
  if(countdown<=0&&!player.finished){ chuffT-=dt; if(chuffT<=0&&Math.abs(player.speed)>1){ chuffT=clamp(0.5-Math.abs(player.speed)/player.c.speed*0.4,0.09,0.5); noise(0.07,player.c.type==='steam'?500:180,0.07); } }
  // camera
  camH+=angDiff(player.h,camH)*Math.min(1,dt*5);
  const fx=Math.sin(camH), fz=Math.cos(camH);
  const cd=8.5+(player.mesh.userData.len-3.8)*0.55; camera.position.set(player.x-fx*cd,4.4+(cd-8.5)*0.25,player.z-fz*cd); camera.lookAt(player.x+fx*5,1.6,player.z+fz*5);
  const fov=player.boost>0?78:65; if(Math.abs(camera.fov-fov)>0.1){ camera.fov+=(fov-camera.fov)*Math.min(1,dt*4); camera.updateProjectionMatrix(); }
  placeSun(player.x,player.z); updateSnow(dt);
  if(flashT>0){ flashT-=dt; if(flashT<=0&&$('msg').textContent==='FINAL LAP!') $('msg').textContent=''; }
  hud();
  if(finishDelay>0){ finishDelay-=dt; if(finishDelay<=0) showResults(); }
}

/* ---------- HUD ---------- */
const ord=n=>n+(['th','st','nd','rd'][n%10>3||Math.floor(n/10)===1?0:n%10]||'th');
const fmt=t=>{ const m=Math.floor(t/60), s=t-m*60; return m+':'+(s<10?'0':'')+s.toFixed(2); };
let mapT=null;
function buildMinimap(){ let a=1e9,b=-1e9,c=1e9,d=-1e9; for(let i=0;i<T.N;i++){ a=Math.min(a,T.px[i]); b=Math.max(b,T.px[i]); c=Math.min(c,T.pz[i]); d=Math.max(d,T.pz[i]); }
  const s=146/Math.max(b-a,d-c); mapT={s, ox:85+(a+b)/2*s, oy:85+(c+d)/2*s}; }
const mx=x=>mapT.ox-x*mapT.s, my=z=>mapT.oy-z*mapT.s;
function hud(){
  const r=player.rank; $('pos').innerHTML=r+'<small>'+ord(r).slice(String(r).length)+'</small>';
  $('lap').textContent='Lap '+clamp(player.lap,1,LAPS)+' / '+LAPS;
  $('time').textContent=fmt(player.finished?player.finishTime:raceTime);
  let info=(mode==='season'?'Season · Race '+(season.round+1)+' / '+TRACKS.length+' · ':mode==='trial'?'Time Trial · ':'')+TRACKS[curTrack].name;
  if(lastLap) info+='<br>Last lap '+fmt(lastLap)+' · Best '+fmt(bestLap);
  if(mode==='trial'){ const rec=getRecCached(); if(rec) info+='<br>Record '+fmt(rec.total)+' · Lap '+fmt(rec.lap); }
  if($('info').innerHTML!==info) $('info').innerHTML=info;
  const it=$('item');
  if(player.pending>0){ const ks=Object.keys(ITEMS); it.innerHTML=ITEMS[ks[Math.floor(performance.now()/80)%ks.length]].icon; }
  else if(player.item) it.innerHTML=ITEMS[player.item].icon+'<span>'+ITEMS[player.item].name+'</span>';
  else it.innerHTML='';
  const d=$('drift'); d.style.opacity=player.drift>0?1:0; d.firstChild.style.width=clamp(player.drift/2.2*100,0,100)+'%'; d.firstChild.style.background=player.drift>0.8?'#ffa630':'#4cf';
  const g=$('map').getContext('2d'); g.clearRect(0,0,170,170);
  g.lineJoin='round'; g.beginPath(); for(let i=0;i<=T.N;i+=2){ const j=i%T.N; i?g.lineTo(mx(T.px[j]),my(T.pz[j])):g.moveTo(mx(T.px[j]),my(T.pz[j])); } g.closePath();
  g.strokeStyle='#000a'; g.lineWidth=8; g.stroke(); g.strokeStyle='#fff'; g.lineWidth=4; g.stroke();
  for(const k of karts){ g.beginPath(); g.arc(mx(k.x),my(k.z),k.isPlayer?6:4,0,7); g.fillStyle='#'+k.c.color.toString(16).padStart(6,'0'); g.fill(); g.lineWidth=k.isPlayer?3:1; g.strokeStyle=k.isPlayer?'#ffd53d':'#fff'; g.stroke(); }
}
let recCache={ti:-1, rec:null};
function getRecCached(){ if(recCache.ti!==curTrack) recCache={ti:curTrack, rec:getRec(curTrack)}; return recCache.rec; }
function showResults(){
  const rest=karts.filter(k=>!k.finished).sort((a,b)=>(b.lap*T.N+b.idx)-(a.lap*T.N+a.idx));
  const all=finishOrder.concat(rest), pr=all.indexOf(player)+1;
  const hr=hofAdd(curTrack, player.finishTime, bestLap||player.finishTime/LAPS);
  const note=(hr.race>=0||hr.lap>=0)?'<h3>🏅 Hall of Fame — '+[hr.race>=0?ord(hr.race+1)+' best race time':'', hr.lap>=0?ord(hr.lap+1)+' best lap':''].filter(Boolean).join(' · ')+' on '+TRACKS[curTrack].name+'</h3>':'';
  let title, html, btn='RACE AGAIN';
  if(mode==='trial'){
    title=hr.race===0?'NEW RECORD! 🏆':'TIME TRIAL';
    html='<h3>'+TRACKS[curTrack].name+' · '+player.c.name+' · Race '+fmt(player.finishTime)+' · Best lap '+fmt(bestLap||player.finishTime/LAPS)+'</h3>'+hofTables(curTrack,hr);
    btn='TRY AGAIN';
  } else {
    const sea=mode==='season';
    if(sea && !season.scored){ all.forEach((k,i)=>season.pts[k.ci]+=POINTS[i]); season.scored=true; if(season.round>=TRACKS.length-1) clearSeason(); else saveSeason(season.round+1); }
    const race='<div><h3>'+TRACKS[curTrack].name+'</h3><table>'+all.map((k,i)=>'<tr class="'+(k.isPlayer?'me':'')+'"><td>'+ord(i+1)+'</td><td>'+k.c.name+'</td><td>'+(k.finished?fmt(k.finishTime):'—')+'</td>'+(sea?'<td>+'+POINTS[i]+'</td>':'')+'</tr>').join('')+'</table></div>';
    title = pr===1 ? 'YOU WIN! 🏆' : 'You finished '+ord(pr);
    html = race;
    if(sea){
      const st=season.roster.slice().sort((a,b)=>season.pts[b]-season.pts[a]), last=season.round===TRACKS.length-1;
      html='<div class="tables">'+race+'<div><h3>'+(last?'Final standings':'Standings after race '+(season.round+1)+' / '+TRACKS.length)+'</h3><table>'+st.map((ci,i)=>'<tr class="'+(ci===selChar?'me':'')+'"><td>'+ord(i+1)+'</td><td>'+CHARS[ci].name+'</td><td>'+season.pts[ci]+' pts</td></tr>').join('')+'</table></div></div>';
      if(last){ title = st[0]===selChar ? 'SEASON CHAMPION! 🏆' : 'Season over — '+CHARS[st[0]].name+' is champion'; btn='NEW SEASON'; if(st[0]===selChar){ whistle(); setTimeout(whistle,500); } }
      else { title='Race '+(season.round+1)+' — '+(pr===1?'You win! 🏆':'you finished '+ord(pr)); btn='NEXT RACE'; html+='<h2>💾 Season saved — you can stop here and pick it up later with “Continue Season” in the menu.</h2>'; }
    }
  }
  $('resTitle').textContent=title; $('resBody').innerHTML=html+(mode==='trial'?'':note); $('again').textContent=btn;
  $('results').style.display='flex'; $('msg').textContent='';
}
function nextAction(){
  if(mode==='season'){ if(season && season.round<TRACKS.length-1){ season.round++; season.scored=false; launchRace(); } else beginFromMenu(); }
  else launchRace();
}

/* ---------- menu ---------- */
function buildMenu(){
  const mxS=30.5, mnS=25;
  $('modes').innerHTML=MODES.map(m=>'<div class="trk mode" data-i="'+m.id+'">'+m.name+'</div>').join('');
  $('chars').innerHTML=CHARS.map((c,i)=>{
    const bar=v=>'<div class="bar"><i style="width:'+Math.round(clamp(v,0.05,1)*100)+'%"></i></div>';
    return '<div class="card" data-i="'+i+'"><div class="sw" style="background:#'+c.color.toString(16).padStart(6,'0')+'">'+(c.num||'★')+'</div><b>'+c.name+'</b><div class="kind">'+c.kind+'</div><div class="st">Speed'+bar((c.speed-mnS)/(mxS-mnS))+'Accel'+bar(c.acc/18)+'Handling'+bar((c.turn-1.2)/1.1)+'</div></div>'; }).join('');
  $('tracks').innerHTML=TRACKS.map((t,i)=>'<div class="trk" data-i="'+i+'">'+t.name+'</div>').join('');
  $('gfx').innerHTML='<div class="trk" data-i="real">Graphics: Realistic</div><div class="trk" data-i="toon">Graphics: Cartoon</div>';
  $('music').innerHTML='<div class="trk" data-i="on">🎵 Music: On</div><div class="trk" data-i="off">🔇 Music: Off</div>';
  $('diffs').innerHTML=DIFFS.map((d,i)=>'<div class="trk" data-i="'+i+'">'+d.name+'</div>').join('');
  const mark=()=>{
    document.querySelectorAll('#modes .trk').forEach(e=>e.classList.toggle('sel',e.dataset.i===mode));
    document.querySelectorAll('#chars .card').forEach((e,i)=>e.classList.toggle('sel',i===selChar));
    document.querySelectorAll('#tracks .trk').forEach((e,i)=>e.classList.toggle('sel',i===selTrack));
    document.querySelectorAll('#diffs .trk').forEach((e,i)=>e.classList.toggle('sel',i===diff));
    document.querySelectorAll('#gfx .trk').forEach(e=>e.classList.toggle('sel',e.dataset.i===gfx));
    document.querySelectorAll('#music .trk').forEach(e=>e.classList.toggle('sel',(e.dataset.i==='on')===musicOn));
    $('tracks').style.display = mode==='season' ? 'none' : 'flex';
    $('diffs').style.display = mode==='trial' ? 'none' : 'flex';
    let d=MODES.find(m=>m.id===mode).desc;
    if(mode==='trial'){ const r=getRec(selTrack); d+=r ? ' Record on '+TRACKS[selTrack].name+': '+fmt(r.total)+' (best lap '+fmt(r.lap)+').' : ' No record yet on '+TRACKS[selTrack].name+'.'; }
    $('modeDesc').textContent=d;
    const sv=loadSeason();
    $('start').textContent = mode==='season' ? (sv?'NEW SEASON':'START SEASON') : mode==='trial' ? 'START TIME TRIAL' : 'START RACE';
    $('resume').style.display = sv ? 'inline-block' : 'none';
    if(sv){ const rank=sv.roster.slice().sort((a,b)=>sv.pts[b]-sv.pts[a]).indexOf(sv.selChar)+1;
      $('resume').textContent='▶ CONTINUE SEASON · Race '+(sv.round+1)+'/'+TRACKS.length+' · '+CHARS[sv.selChar].name+' · '+sv.pts[sv.selChar]+' pts'+(sv.round>0?' ('+ord(rank)+')':''); }
  };
  window.refreshMenu=mark;
  const pick=(id,sel,fn)=>{ $(id).onclick=e=>{ const c=e.target.closest(sel); if(!c) return; initAudio(); fn(c.dataset.i); mark(); }; };
  pick('modes','.trk',i=>{ mode=i; });
  pick('chars','.card',i=>{ selChar=+i; showPreview(); });
  pick('tracks','.trk',i=>{ selTrack=+i; buildWorld(selTrack); previewEngine=null; showPreview(); });
  pick('diffs','.trk',i=>{ diff=+i; });
  pick('gfx','.trk',i=>{ setGfx(i); showPreview(); });
  pick('music','.trk',i=>{ setMusic(i); });
  mark(); syncMusicGain();
}
$('musicBtn').onclick=e=>{ e.stopPropagation(); toggleMusic(); };
$('hofBtn').onclick=()=>{ initAudio(); showHof(selTrack); }; $('hofClose').onclick=()=>{ $('hof').style.display='none'; };
$('hofTracks').onclick=e=>{ const c=e.target.closest('.trk'); if(c) showHof(+c.dataset.i); };
try{ $('who').value=localStorage.getItem('ssr_name')||''; }catch(e){}
$('who').oninput=()=>{ try{ localStorage.setItem('ssr_name',$('who').value); }catch(e){} };
$('start').onclick=beginFromMenu; $('resume').onclick=continueSeason; $('again').onclick=nextAction; $('back').onclick=toMenu;
addEventListener('pointerdown',e=>{ if(e.target!==$('musicBtn')) initAudio(); });
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'){ if(e.code==='Enter') e.target.blur(); return; }
  initAudio();
  if(e.code==='KeyM'&&!e.repeat){ toggleMusic(); return; }
  if($('hof').style.display==='flex'){ if(e.code==='Escape'||e.code==='Enter') $('hof').style.display='none'; return; }
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(state==='menu'&&e.code==='Enter') beginFromMenu();
  else if(state==='race'){
    const res=$('results').style.display==='flex';
    if(e.code==='Space'&&!e.repeat&&countdown<=0&&!paused&&!player.finished&&player.spin<=0) useItem(player);
    if(e.code==='Escape') toMenu();
    else if(e.code==='Enter'&&res) nextAction();
    else if(e.code==='KeyP'&&!res&&countdown<=0&&!player.finished){ paused=!paused; syncMusicGain(); $('msg').textContent=paused?'PAUSED':''; }
  }
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='race'){ if(!paused) update(dt); }
  else if(previewEngine){ const a=now/2500, p=previewEngine.position; camera.fov=50; camera.updateProjectionMatrix(); const pr=5.5+previewEngine.userData.len*0.65; camera.position.set(p.x+Math.sin(a)*pr,3.2,p.z+Math.cos(a)*pr); camera.lookAt(p.x,1.9,p.z); placeSun(p.x,p.z); updateSnow(dt); animEngine(previewEngine,now/300,Math.sin(now/900)); }
  renderer.render(scene,camera);
}
buildMenu(); toMenu(); requestAnimationFrame(frame);
</script>
